            <span>от 1500 ₽</span>
        </div>

        <div class="card" onclick="выбратьУслугу(this, 'Окрашивание', 3000)">
            <h3>🎨 Окрашивание</h3>
            <span>от 3000 ₽</span>
        </div>

        <div class="card" onclick="выбратьУслугу(this, 'Маникюр', 1200)">
            <h3>💅 Маникюр</h3>
            <span>от 1200 ₽</span>
        </div>

        <div class="divider"></div>

        <div class="section-title">Контакты</div>

        <a href="tel:+79990000000" class="contact-row">
            <span class="icon">📞</span>
            <div>
                <div class="text">+7 (999) 000-00-00</div>
                <div class="sub">Позвонить</div>
            </div>
        </a>

        <a href="https://t.me/trizzimoon" class="contact-row">
            <span class="icon">✈️</span>
            <div>
                <div class="text">Telegram</div>
                <div class="sub">Написать нам</div>
            </div>
        </a>

        <div class="contact-row">
            <span class="icon">📍</span>
            <div>
                <div class="text">ул. Примерная, д. 1</div>
                <div class="sub">Работаем: 10:00–20:00</div>
            </div>
        </div>
    </div>

    <!-- Экран успеха -->
    <div id="successScreen" class="success">
        <div class="check">✅</div>
        <h2>Заявка отправлена!</h2>
        <p>Мы свяжемся с вами для подтверждения.</p>
    </div>

    <!-- Кнопка внизу -->
    <div class="bottom-btn" id="bottomBtn">
        <button onclick="отправитьЗапись()">Записаться</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        let выбраннаяУслуга = null;

        function выбратьУслугу(элемент, услуга, цена) {
            // Снимаем выделение со всех карточек
            document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
            // Выделяем выбранную
            элемент.classList.add('selected');
            выбраннаяУслуга = { название: услуга, цена: цена };
            tg.HapticFeedback.impactOccurred('light');
        }

        function отправитьЗапись() {
            if (!выбраннаяУслуга) {
                tg.showAlert('Пожалуйста, выберите услугу');
                return;
            }

            // Отправляем данные боту
            tg.sendData(JSON.stringify({
                действие: 'запись',
                услуга: выбраннаяУслуга.название,
                цена: выбраннаяУслуга.цена
            }));

            // Показываем экран успеха
            document.getElementById('mainScreen').style.display = 'none';
            document.getElementById('bottomBtn').style.display = 'none';
            document.getElementById('successScreen').style.display = 'block';

            tg.HapticFeedback.notificationOccurred('success');

            // Закрываем окно через 3 секунды
            setTimeout(() => tg.close(), 3000);
        }
    </script>
</body>
</html>
